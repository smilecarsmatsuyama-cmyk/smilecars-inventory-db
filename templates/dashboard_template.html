<!doctype html>
<title>非課税項目管理ダッシュボード | スマイルカーズ松山店</title>
<meta name="description" content="契約書・精算書から抽出した非課税項目(リサイクル料・自動車税・自賠責保険料)と課税対象額を管理する社内ダッシュボード">

<style>
:root {
  --paper: #F5F3EE;
  --surface: #FFFFFF;
  --ink: #211C17;
  --ink-soft: #6E655A;
  --line: #E4DFD3;
  --accent: #C9611E;
  --accent-deep: #9C4A15;
  --accent-tint: #FBE9D8;
  --nontax: #1F4B3F;
  --nontax-tint: #E7EFEA;
  --tax: #4A3F73;
  --tax-tint: #EBE7F5;
  --warn: #B3492E;
  --warn-tint: #F6E4DE;
  --font: "Hiragino Sans", "Yu Gothic Medium", "YuGothic", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #15130F;
    --surface: #1E1B16;
    --ink: #F1ECE2;
    --ink-soft: #B2A897;
    --line: #38322A;
    --accent: #E38B44;
    --accent-deep: #F0A868;
    --accent-tint: #3A2A18;
    --nontax: #6FB59B;
    --nontax-tint: #1C2B25;
    --tax: #A79BD9;
    --tax-tint: #262038;
    --warn: #E38267;
    --warn-tint: #3A2620;
  }
}
:root[data-theme="dark"] {
  --paper: #15130F; --surface: #1E1B16; --ink: #F1ECE2; --ink-soft: #B2A897;
  --line: #38322A; --accent: #E38B44; --accent-deep: #F0A868; --accent-tint: #3A2A18;
  --nontax: #6FB59B; --nontax-tint: #1C2B25; --tax: #A79BD9; --tax-tint: #262038;
  --warn: #E38267; --warn-tint: #3A2620;
}
:root[data-theme="light"] {
  --paper: #F5F3EE; --surface: #FFFFFF; --ink: #211C17; --ink-soft: #6E655A;
  --line: #E4DFD3; --accent: #C9611E; --accent-deep: #9C4A15; --accent-tint: #FBE9D8;
  --nontax: #1F4B3F; --nontax-tint: #E7EFEA; --tax: #4A3F73; --tax-tint: #EBE7F5;
  --warn: #B3492E; --warn-tint: #F6E4DE;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }
body {
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.6;
  padding: 0 0 4rem;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 1.5rem; }

header.top {
  border-bottom: 1px solid var(--line);
  padding: 1.75rem 0 1.5rem;
  margin-bottom: 2rem;
}
header.top .eyebrow {
  font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em;
  color: var(--accent-deep); background: var(--accent-tint);
  display: inline-block; padding: 0.25rem 0.7rem; border-radius: 999px;
  margin-bottom: 0.6rem;
}
header.top h1 { font-size: 1.5rem; margin: 0 0 0.25rem; font-weight: 800; }
header.top .meta { color: var(--ink-soft); font-size: 0.88rem; }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 0.9rem;
  margin-bottom: 2rem;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1.1rem 1.2rem;
}
.kpi .label { font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 0.4rem; }
.kpi .value { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 0.78rem; color: var(--ink-soft); margin-top: 0.3rem; font-variant-numeric: tabular-nums; }
.kpi .unit { font-size: 0.85rem; font-weight: 500; color: var(--ink-soft); margin-left: 0.15rem; }
.kpi.accent .value { color: var(--accent-deep); }
.kpi.nontax .value { color: var(--nontax); }
.kpi.tax .value { color: var(--tax); }
.kpi.warn .value { color: var(--warn); }

.section-heading {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 0 0 0.8rem;
}
.section-heading h2 { font-size: 1rem; font-weight: 800; margin: 0; }
.section-heading .note { font-size: 0.78rem; color: var(--ink-soft); }
.section-divider { border: none; border-top: 1px solid var(--line); margin: 2rem 0; }

.controls {
  display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: center;
  margin-bottom: 1.1rem;
}
.controls input[type="search"] {
  flex: 1 1 220px;
  padding: 0.6rem 0.9rem;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-family: inherit;
  font-size: 0.92rem;
}
.controls input[type="search"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button {
  border: none; background: var(--surface); color: var(--ink-soft);
  padding: 0.55rem 0.95rem; font-family: inherit; font-size: 0.88rem; font-weight: 600;
  cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.table-scroll {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 880px; }
thead th {
  text-align: left; padding: 0.75rem 0.9rem; color: var(--ink-soft);
  font-weight: 700; font-size: 0.76rem; letter-spacing: 0.02em;
  border-bottom: 1px solid var(--line);
  white-space: nowrap; cursor: pointer; user-select: none;
  position: sticky; top: 0; background: var(--surface);
}
thead th[data-sort-active="true"] { color: var(--ink); }
thead th .arrow { opacity: 0.4; margin-left: 0.2rem; }
thead th[data-sort-active="true"] .arrow { opacity: 1; }
tbody td { padding: 0.75rem 0.9rem; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: none; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.badge {
  display: inline-block; font-size: 0.74rem; font-weight: 700;
  padding: 0.2rem 0.55rem; border-radius: 999px;
}
.badge.buy { background: var(--nontax-tint); color: var(--nontax); }
.badge.sell { background: var(--accent-tint); color: var(--accent-deep); }
.breakdown { font-size: 0.78rem; color: var(--ink-soft); }
.breakdown .item { white-space: nowrap; }

.empty-state {
  text-align: center;
  padding: 3.5rem 1.5rem;
  color: var(--ink-soft);
}
.empty-state .big { font-size: 1.05rem; font-weight: 700; color: var(--ink); margin-bottom: 0.5rem; }
.empty-state p { max-width: 44ch; margin: 0 auto 0.4rem; font-size: 0.9rem; }

footer.foot {
  margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line);
  color: var(--ink-soft); font-size: 0.82rem;
}
footer.foot a { color: var(--accent-deep); }
</style>

<div class="wrap">
  <header class="top">
    <span class="eyebrow">非課税項目管理</span>
    <h1>非課税項目管理ダッシュボード</h1>
    <div class="meta">スマイルカーズ松山店 / 契約書・精算書から抽出した取引データ・最終更新: <span id="generatedAt"></span></div>
  </header>

  <div class="section-heading">
    <h2>経営サマリー</h2>
    <span class="note">全期間・課税対象額(車両本体分)ベース</span>
  </div>
  <div class="kpi-grid" id="bizKpiGrid"></div>

  <hr class="section-divider">

  <div class="section-heading">
    <h2>非課税項目の内訳</h2>
    <span class="note">下の検索・絞り込みに連動します</span>
  </div>
  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="controls">
    <input type="search" id="searchInput" placeholder="相手方・車名で検索">
    <div class="seg" id="typeFilter">
      <button data-type="all" aria-pressed="true">すべて</button>
      <button data-type="buy" aria-pressed="false">仕入</button>
      <button data-type="sell" aria-pressed="false">販売</button>
    </div>
  </div>

  <div class="table-scroll">
    <table id="recordsTable">
      <thead>
        <tr>
          <th data-key="deal_date">取引日<span class="arrow">▾</span></th>
          <th data-key="type">区分<span class="arrow">▾</span></th>
          <th data-key="counterparty">相手方<span class="arrow">▾</span></th>
          <th data-key="vehicle">車名・型式<span class="arrow">▾</span></th>
          <th data-key="total_amount">総額<span class="arrow">▾</span></th>
          <th>非課税内訳</th>
          <th data-key="taxable_amount">課税対象額<span class="arrow">▾</span></th>
          <th data-key="consumption_tax_estimate">消費税概算<span class="arrow">▾</span></th>
          <th>元資料</th>
        </tr>
      </thead>
      <tbody id="recordsBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" hidden>
      <div class="big">まだ記録がありません</div>
      <p>契約書・精算書の写真をチャットに送っていただければ、総額・リサイクル料・自動車税・自賠責保険料・課税対象額を読み取ってここに記録します。</p>
    </div>
  </div>

  <footer class="foot">
    このダッシュボードがデータの正本です。写真のアップロード先: <a href="__UPLOAD_FOLDER_URL__" target="_blank" rel="noopener">Googleドライブ フォルダ</a>
  </footer>
</div>

<script>
const DATA = __RECORDS_JSON__;
const GENERATED_AT = "__GENERATED_AT__";

document.getElementById("generatedAt").textContent = GENERATED_AT;

const fmtYen = (n) => "¥" + Math.round(n).toLocaleString("ja-JP");

function computeKPIs(records) {
  const count = records.length;
  const sum = (key) => records.reduce((a, r) => a + (Number(r[key]) || 0), 0);
  const total = sum("total_amount");
  const nontax = sum("recycle_fee") + sum("auto_tax_proration") + sum("jibaiseki_fee") + sum("other_nontaxable_amount");
  const taxable = sum("taxable_amount");
  const taxEst = sum("consumption_tax_estimate");
  return { count, total, nontax, taxable, taxEst };
}

function renderKPIs(records) {
  const k = computeKPIs(records);
  const grid = document.getElementById("kpiGrid");
  grid.innerHTML = `
    <div class="kpi"><div class="label">取引件数</div><div class="value">${k.count.toLocaleString("ja-JP")}<span class="unit">件</span></div></div>
    <div class="kpi"><div class="label">総額 合計</div><div class="value">${fmtYen(k.total)}</div></div>
    <div class="kpi nontax"><div class="label">非課税項目 合計</div><div class="value">${fmtYen(k.nontax)}</div></div>
    <div class="kpi accent"><div class="label">課税対象額 合計</div><div class="value">${fmtYen(k.taxable)}</div></div>
    <div class="kpi tax"><div class="label">消費税概算 合計</div><div class="value">${fmtYen(k.taxEst)}</div></div>
  `;
}

function computeBizKPIs(records) {
  const buys = records.filter((r) => r.type === "buy");
  const sells = records.filter((r) => r.type === "sell");
  const sum = (list, key) => list.reduce((a, r) => a + (Number(r[key]) || 0), 0);
  const buyTotal = sum(buys, "taxable_amount");
  const sellTotal = sum(sells, "taxable_amount");
  const profit = sellTotal - buyTotal;
  const marginPct = sellTotal > 0 ? (profit / sellTotal) * 100 : null;
  return { buyCount: buys.length, sellCount: sells.length, buyTotal, sellTotal, profit, marginPct };
}

function renderBizKPIs(records) {
  const b = computeBizKPIs(records);
  const grid = document.getElementById("bizKpiGrid");
  const profitClass = b.profit < 0 ? "warn" : "nontax";
  const marginText = b.marginPct === null ? "-" : `${b.marginPct.toFixed(1)}%`;
  grid.innerHTML = `
    <div class="kpi"><div class="label">仕入 合計</div><div class="value">${fmtYen(b.buyTotal)}</div><div class="sub">${b.buyCount.toLocaleString("ja-JP")}件</div></div>
    <div class="kpi accent"><div class="label">売上 合計</div><div class="value">${fmtYen(b.sellTotal)}</div><div class="sub">${b.sellCount.toLocaleString("ja-JP")}件</div></div>
    <div class="kpi ${profitClass}"><div class="label">粗利(売上-仕入)</div><div class="value">${fmtYen(b.profit)}</div></div>
    <div class="kpi ${profitClass}"><div class="label">利益率</div><div class="value">${marginText}</div></div>
  `;
}

function renderBreakdown(r) {
  const parts = [];
  if (r.recycle_fee) parts.push(`<span class="item">リサイクル ${fmtYen(r.recycle_fee)}</span>`);
  if (r.auto_tax_proration) parts.push(`<span class="item">自動車税 ${fmtYen(r.auto_tax_proration)}</span>`);
  if (r.jibaiseki_fee) parts.push(`<span class="item">自賠責 ${fmtYen(r.jibaiseki_fee)}</span>`);
  if (r.other_nontaxable_amount) parts.push(`<span class="item">${r.other_nontaxable_note || "その他"} ${fmtYen(r.other_nontaxable_amount)}</span>`);
  return parts.length ? parts.join("<br>") : "-";
}

let sortKey = "deal_date";
let sortDir = -1;
let typeFilterValue = "all";
let searchValue = "";

function getFiltered() {
  return DATA.records.filter((r) => {
    if (typeFilterValue !== "all" && r.type !== typeFilterValue) return false;
    if (searchValue) {
      const hay = `${r.counterparty || ""} ${r.vehicle || ""}`.toLowerCase();
      if (!hay.includes(searchValue.toLowerCase())) return false;
    }
    return true;
  });
}

function render() {
  const filtered = getFiltered();
  renderKPIs(filtered);

  const sorted = [...filtered].sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (typeof av === "number" || typeof bv === "number") {
      return ((Number(av) || 0) - (Number(bv) || 0)) * sortDir;
    }
    return String(av || "").localeCompare(String(bv || ""), "ja") * sortDir;
  });

  const body = document.getElementById("recordsBody");
  const empty = document.getElementById("emptyState");
  const table = document.getElementById("recordsTable");

  if (sorted.length === 0) {
    body.innerHTML = "";
    table.style.display = "none";
    empty.hidden = false;
  } else {
    table.style.display = "";
    empty.hidden = true;
    body.innerHTML = sorted.map((r) => `
      <tr>
        <td>${r.deal_date || "-"}</td>
        <td><span class="badge ${r.type === "sell" ? "sell" : "buy"}">${r.type === "sell" ? "販売" : "仕入"}</span></td>
        <td>${r.counterparty || "-"}</td>
        <td>${r.vehicle || "-"}</td>
        <td class="num">${fmtYen(r.total_amount || 0)}</td>
        <td class="breakdown">${renderBreakdown(r)}</td>
        <td class="num">${fmtYen(r.taxable_amount || 0)}</td>
        <td class="num">${fmtYen(r.consumption_tax_estimate || 0)}</td>
        <td>${r.source_file || "-"}</td>
      </tr>
    `).join("");
  }

  document.querySelectorAll("thead th[data-key]").forEach((th) => {
    th.dataset.sortActive = (th.dataset.key === sortKey) ? "true" : "false";
    const arrow = th.querySelector(".arrow");
    if (th.dataset.key === sortKey) arrow.textContent = sortDir === 1 ? "▴" : "▾";
  });
}

document.querySelectorAll("thead th[data-key]").forEach((th) => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = 1; }
    render();
  });
});

document.getElementById("typeFilter").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-type]");
  if (!btn) return;
  typeFilterValue = btn.dataset.type;
  document.querySelectorAll("#typeFilter button").forEach((b) => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
  render();
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  searchValue = e.target.value;
  render();
});

renderBizKPIs(DATA.records);
render();
</script>
