name: Process Contract Uploads

on:
  schedule:
    # 3時間ごとにチェック(正時・30分は避けて13分に設定)
    - cron: "13 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: process-uploads
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process new uploads from Google Drive
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/process_uploads.py

      - name: Rebuild dashboard
        run: python build_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/records.json docs/index.html
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "契約書アップロードを反映 [skip ci]"
          git pull --rebase origin main
          git push

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: process-uploads-logs
          path: data/records.json
          retention-days: 7
